let step=-1,ans=Array(8).fill(null),feedback=null;
const el=document.getElementById('content');
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function home(){step=-1;el.innerHTML=`<div class="hero"><span class="pill">8道选择题 · 目标60秒</span><h1>你的旅行灵魂<br>是哪种小动物？</h1><p>有人为了风景早起，有人为了假期睡到自然醒。<br>用8个小选择，认识真实的旅行自己。</p><div style="font-size:48px;margin:28px 0">✈️ 🧭 🧳</div><button class="btn" onclick="start()">开始测试 →</button><p class="small">无需登录 · 不上传答题数据</p></div>`}
function start(){step=0;renderQuestion()}
function renderQuestion(){const q=Q[step];el.innerHTML=`<div class="mini">QUESTION ${String(step+1).padStart(2,'0')} / 08</div><div class="progress"><div style="width:${step*12.5}%"></div></div><h1 class="question">${escapeHTML(q[0])}</h1>${[1,2].map((j)=>`<button class="choice" onclick="choose(${j-1})"><span class="letter">${j===1?'A':'B'}</span><span>${escapeHTML(q[j])}</span></button>`).join('')}<button class="back" onclick="back()">← 上一题</button>`}
function choose(v){ans[step]=v;if(step===7){step=8;result()}else{step++;renderQuestion()}}
function back(){if(step===0)home();else{step--;renderQuestion()}}
function measure(){let code='',strength=[];for(let k=0;k<3;k++){let p=ans[k*2],s=ans[k*2+1];code+=[['X','C'],['H','L'],['J','P']][k][p];strength.push(p===s?'较明确':'混合倾向')}return {code,strength,social:ans[6]===0?'偏好结伴':'接受分开行动',boundary:ans[7]===0?'不喜欢全程绑定':'不喜欢反复争论'}}
function result(){const m=measure(),r=ROLES[m.code],idx=r[3];let dims=[['探索体验','舒适品质',ans[0],ans[1]],['高强度','轻松节奏',ans[2],ans[3]],['计划优先','随性应变',ans[4],ans[5]]];el.innerHTML=`<div class="mini" style="text-align:center">YOUR TRAVEL ID · 测试结果</div><div class="poster" id="poster" style="margin-top:16px"><div class="label">TRAVEL ID / ${m.code}</div><img class="picture" src="${ART[idx]}" alt="${r[0]}"><div class="label">${r[0]} · 你的旅行动物</div><h2>${r[1]}</h2><div class="intro">“${r[2]}”</div><div class="tags"><span class="tag">${ans[0]===0?'探索体验':'舒适品质'}</span><span class="tag">${ans[2]===0?'活力行动':'慢节奏'}</span><span class="tag">${ans[4]===0?'计划出行':'即兴出发'}</span><span class="tag">${m.social}</span></div><p class="mini" style="margin:25px 0 0">不同旅人 · 同样精彩的世界</p></div><div class="section">旅行行为画像</div>${dims.map((d,i)=>`<div class="bar"><div class="titles"><span>${d[0]}</span><span>${d[2]===d[3]?(d[2]===0?"偏向左侧 · 较明确":"偏向右侧 · 较明确"):"中间 · 混合倾向"}</span><span>${d[1]}</span></div><div class="bipolar" role="img" aria-label="${d[0]}与${d[1]}：${d[2]===d[3]?(d[2]===0?"左侧偏好":"右侧偏好"):"混合偏好"}"><span class="dot" style="left:${d[2]===d[3]?(d[2]===0?8:92):50}%"></span></div></div>`).join('')}<p class="axisnote">圆点越靠近哪一侧，越倾向该旅行方式；位于中间表示两题选择不同。</p><div class="section">和搭子相处时</div><p class="small" style="line-height:1.9">${m.social}；${m.boundary}。这只是初步偏好，并非真实匹配评分。</p><div class="section">你觉得这个结果符合自己吗？</div><div class="feedback">${['很符合','一般','不符合'].map((t,i)=>`<button onclick="rate(${i})" id="rate${i}">${t}</button>`).join('')}</div><p class="small" id="thank"></p><div class="actions"><button class="btn" onclick="saveCard()">保存身份卡图片</button><button class="btn secondary" onclick="shareResult()">分享结果 / 复制介绍</button><button class="btn secondary" onclick="reset()">再测一次</button></div><p class="notice">V2.3 测试版 · 结果仅用于娱乐与产品验证。答题数据不会发送到服务器，反馈暂时只保存在本次页面中。</p>`}
function rate(i){feedback=i;document.querySelectorAll('.feedback button').forEach((b,j)=>b.classList.toggle('sel',j===i));document.getElementById('thank').textContent='感谢反馈。当前离线版本不会自动汇总反馈，请把结果告诉测试发起人。'}
function reset(){ans=Array(8).fill(null);feedback=null;home()}
async function shareResult(){const m=measure(),r=ROLES[m.code],txt=`我的 Travel ID：${r[0]} · ${r[1]}（${m.code}）\n${r[2]}\n${location.protocol.startsWith('http')?location.href:''}`;try{if(navigator.share){await navigator.share({title:'我的旅行动物人格',text:txt});return}await navigator.clipboard.writeText(txt);alert('已复制结果，可粘贴发给朋友')}catch(e){prompt('复制下面的结果：',txt)}}
async function saveCard(){const m=measure(),r=ROLES[m.code],canvas=document.getElementById('exportCanvas'),ctx=canvas.getContext('2d');ctx.textAlign='left';ctx.fillStyle='#f5f9fd';ctx.fillRect(0,0,800,1120);ctx.fillStyle='#27405c';ctx.font='bold 40px sans-serif';ctx.fillText('Travel ID',68,85);ctx.fillStyle='#6f839e';ctx.font='24px sans-serif';ctx.fillText('YOUR TRAVEL PERSONALITY',68,130);let img=new Image();img.src=ART[r[3]];await img.decode();ctx.save();ctx.beginPath();ctx.roundRect(115,168,570,625,35);ctx.clip();ctx.drawImage(img,115,168,570,625);ctx.restore();ctx.fillStyle='#263958';ctx.textAlign='center';ctx.font='bold 51px sans-serif';ctx.fillText(r[1],400,865);ctx.font='25px sans-serif';ctx.fillText(`${r[0]} · ${m.code}`,400,910);ctx.font='22px sans-serif';ctx.fillText(r[2],400,965);ctx.font='19px sans-serif';ctx.fillStyle='#7d91a8';ctx.fillText('8题认识你的旅行动物人格 · Travel ID',400,1050);canvas.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Travel-ID-${r[1]}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)})}
home();
</script></body></html>
